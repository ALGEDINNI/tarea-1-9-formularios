<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>

<form action="index.html" method="get">
    <fieldset>
        <legend>Creación de formulario by Alejandro</legend>
        
<label for="nombre">Nombre:</label>

<input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre"
       required autofocus size="30" maxlength="40">
<br>


<label for="clave">Contraseña:</label>
<input type="password" id="clave" name="clave" minlength="8">
<br>


<label for="correo">Correo:</label>
<input type="email" id="correo" name="correo" required>
<br>


<label for="telefono">Teléfono:</label>
<input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}">
<br>

    </fieldset>
</form>
    
</body>
</html>
