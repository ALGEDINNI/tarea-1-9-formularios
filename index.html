<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>
<!-- form: agrupa los campos que se envían juntos ; action: indica donde se envían los datos ; method: indica cómo se envían los datos -->
<form action="index.html" method="get">
    <!-- fieldset: agrupa los campos del formulario -->
    <fieldset>
        <!-- legend: es el título del grupo -->
        <legend>Creación de formulario by Alejandro</legend>
        
<!-- label: el etiqueta del campo ; for: el ID del campo -->
<label for="nombre">Nombre:</label>
<!-- input: el campo de entrada ; type: el tipo de campo ; text: el texto inicial ; id: el ID del campo ; name: el nombre del campo ;
     placeholder: el texto de ayuda ; required: indica que es obligatorio ; autofocus: se enfoca automáticamente ; size: el tamaño ; maxlength: la longitud máxima -->
<input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre"
       required autofocus size="30" maxlength="40">
<br>

<!-- password: el campo para ingresar la contraseña ; minlength: la longitud mínima -->
<label for="clave">Contraseña:</label>
<input type="password" id="clave" name="clave" minlength="8">
<br>

<!-- email: el campo para ingresar el correo electrónico -->
<label for="correo">Correo:</label>
<input type="email" id="correo" name="correo" required>
<br>

<!-- tel: el campo para ingresar el número de teléfono ; pattern: el patrón que debe seguir -->
<label for="telefono">Teléfono:</label>
<input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}">
<br>

<!-- date: la fecha -->
<label for="nacimiento">Fecha de nacimiento:</label>
<input type="date" id="nacimiento" name="nacimiento">
<br>

<!-- file: el campo para subir archivos -->
<label for="foto">Foto:</label>
<input type="file" id="foto" name="foto">
<br>

<!-- value: el valor inicial ; readonly: indica que el campo no se puede modificar -->
<label for="curso">Curso:</label>
<input type="text" id="curso" name="curso" value="2026-27" readonly>
<br>

<!-- disabled: indica que el campo está deshabilitado -->
<label for="centro">Centro:</label>
<input type="text" id="centro" name="centro" value="IES La Asunción" disabled>
<br>

    </fieldset>
        </fieldset>   <!-- este es el cierre del primer fieldset -->

    <fieldset>
        <legend>Preferencias</legend>

        Turno:
        <!-- radio: es un campo que permite seleccionar una sola opción -->
        <input type="radio" id="manana" name="turno" value="manana">
        <label for="manana">Mañana</label>
        <input type="radio" id="tarde" name="turno" value="tarde">
        <label for="tarde">Tarde</label>
        <br>

        Intereses:
        <!-- checkbox: es un campo que permite seleccionar múltiples opciones -->
        <input type="checkbox" id="programacion" name="intereses" value="programacion">
        <label for="programacion">Programación</label>
        <input type="checkbox" id="redes" name="intereses" value="redes">
        <label for="redes">Redes</label>
        <input type="checkbox" id="disenyo" name="intereses" value="disenyo">
        <label for="disenyo">Diseño web</label>
        <br>

        <!-- number: es un campo para ingresar números ; min: el valor mínimo ; max: el valor máximo ; step: es el paso -->
<label for="horas">Horas de estudio:</label>
<input type="number" id="horas" name="horas" min="0" max="10" step="2">
<br>

<!-- range: es un campo para ingresar un valor dentro de un rango -->
<label for="nivel">Nivel:</label>
<input type="range" id="nivel" name="nivel" min="1" max="10">
<br>

<!-- color: es un campo para seleccionar un color -->
<label for="color">Color favorito:</label>
<input type="color" id="color" name="color">
<br>

<!-- time: es un campo para ingresar una hora -->

<label for="hora">Hora:</label>
<input type="time" id="hora" name="hora">
<br>

<!-- week: es un campo para ingresar una semana -->
<label for="semana">Semana:</label>
<input type="week" id="semana" name="semana">
<br>

<!-- month: es un campo para ingresar un mes -->
<label for="mes">Mes:</label>
<input type="month" id="mes" name="mes">
<br>

    </fieldset>
</form>   <!-- el cierre del form -->
</form>
    
</body>
</html>
